name: telegram-max-bridge

x-bridge: &bridge
  image: ${BRIDGE_IMAGE:-telegram-max-bridge:local}
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=${BRIDGE_TMPFS_SIZE:-64m},mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    STORAGE_WARN_BYTES: ${STORAGE_WARN_BYTES-268435456}
    STORAGE_CRITICAL_BYTES: ${STORAGE_CRITICAL_BYTES-536870912}
    STORAGE_FREE_WARN_BYTES: ${STORAGE_FREE_WARN_BYTES-268435456}
    STORAGE_FREE_CRITICAL_BYTES: ${STORAGE_FREE_CRITICAL_BYTES-134217728}
    STORAGE_CHECK_INTERVAL: ${STORAGE_CHECK_INTERVAL-5}
    ALERTS_MAX_BYTES: ${ALERTS_MAX_BYTES-10485760}
    ALERTS_BACKUP_COUNT: ${ALERTS_BACKUP_COUNT-4}
    ALERTS_RETENTION_DAYS: ${ALERTS_RETENTION_DAYS-90}
    RETENTION_CONTENT_ENABLED: ${RETENTION_CONTENT_ENABLED-1}
    RETENTION_CONTENT_DAYS: ${RETENTION_CONTENT_DAYS-30}
    RETENTION_HISTORY_DAYS: ${RETENTION_HISTORY_DAYS-90}
    MAINTENANCE_INTERVAL: ${MAINTENANCE_INTERVAL-60}
    MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE-100}
    MAINTENANCE_BUDGET_MS: ${MAINTENANCE_BUDGET_MS-50}
  env_file:
    - path: 02-messenger-sync/.env
      required: false
  volumes:
    - state:/state
  restart: unless-stopped
  stop_signal: SIGTERM
  # The bridge gives active operations 30 s after SIGTERM; leave headroom before SIGKILL.
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  bridge:
    <<: *bridge
    build:
      context: .
    command: ["run"]
    healthcheck:
      test: ["CMD", "python", "/app/02-messenger-sync/poc/bridge.py", "health", "--json",
             "--stale-after", "${HEALTH_STALE_AFTER:-180}", "--queue-age", "${HEALTH_QUEUE_AGE:-300}"]
      interval: ${HEALTH_INTERVAL:-30s}
      timeout: 10s
      start_period: ${HEALTH_START_PERIOD:-60s}
      retries: 3

  monitor:
    <<: *bridge
    command: ["monitor", "--interval", "30", "--alerts-file", "/state/alerts.jsonl",
              "--stale-after", "${HEALTH_STALE_AFTER:-180}", "--queue-age", "${HEALTH_QUEUE_AGE:-300}"]
    network_mode: none
    depends_on:
      - bridge

  test:
    <<: *bridge
    profiles: ["tools"]
    restart: "no"
    env_file: []
    # Unit fixtures use /tmp (64 MiB), not the production state volume.
    environment:
      STORAGE_FREE_WARN_BYTES: "2"
      STORAGE_FREE_CRITICAL_BYTES: "1"
    volumes: []
    network_mode: none
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "/app/02-messenger-sync/poc", "-p", "test_*.py"]
    command: []

  smoke:
    <<: *bridge
    profiles: ["tools"]
    restart: "no"
    env_file: []
    environment:
      STORAGE_FREE_WARN_BYTES: "2"
      STORAGE_FREE_CRITICAL_BYTES: "1"
    volumes: []
    network_mode: none
    entrypoint: ["sh", "-ec", "python smoke_p0.py && python smoke_async.py"]
    command: []

volumes:
  state:
